# Halflight — XcodeGen project spec.
# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: Halflight
options:
  bundleIdPrefix: app.halflight
  deploymentTarget:
    iOS: "27.1"
  xcodeVersion: "27.1"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Local StoreKit config for Pawlight's in-app purchase (used by the Pawlight scheme's Run action).
fileGroups:
  - StoreKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "27.1"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Set HALFLIGHT_DUO_CONDITIONS to "HALFLIGHT_DUO_SDK" once the iOS 27.1 Duo headers
    # (CameraCaptureAccessory, onHingeChange, AVCaptureDeviceDirectionCoordinator) are
    # confirmed in your SDK. Everything Duo-specific lives in Halflight/DuoBridge and
    # degrades to stubs while the flag is off, so the app builds on any iOS 27.1 SDK.
    HALFLIGHT_DUO_CONDITIONS: ""
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(HALFLIGHT_DUO_CONDITIONS)"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG $(HALFLIGHT_DUO_CONDITIONS)"

targets:
  Halflight:
    type: application
    platform: iOS
    sources:
      - path: Halflight
    info:
      path: Halflight/Resources/Info.plist
      properties:
        CFBundleDisplayName: Halflight
        CFBundleName: Halflight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSCameraUsageDescription: Halflight needs the camera to show a viewfinder and take photos and video.
        NSMicrophoneUsageDescription: Halflight records sound with your videos. Photos never use the microphone.
        NSPhotoLibraryAddUsageDescription: Halflight saves the shots you choose to your Photos library. It never reads your library.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.halflight.duo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        STRING_CATALOG_GENERATE_SYMBOLS: NO

  HalflightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HalflightTests
    dependencies:
      - target: Halflight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.halflight.duo.tests

  # Pawlight: the pet camera. Its own code lives in Pawlight/; the files listed below are
  # Halflight's, compiled into both apps unchanged. Pawlight supplies its own Theme and AlertItem.
  Pawlight:
    type: application
    platform: iOS
    sources:
      - path: Pawlight
      - path: Halflight/Capture/CameraSession.swift
      - path: Halflight/Capture/CameraPreviewView.swift
      - path: Halflight/Capture/CaptureEventHost.swift
      - path: Halflight/Capture/StillHint.swift
      - path: Halflight/DuoBridge/DirectionCoordinator.swift
      - path: Halflight/DuoBridge/DuoCapabilities.swift
      - path: Halflight/DuoBridge/FoldReservedRegion.swift
      - path: Halflight/DuoBridge/HingeObserver.swift
      - path: Halflight/Library/MediaItem.swift
      - path: Halflight/Library/MediaStore.swift
      - path: Halflight/Support/Haptics.swift
      - path: Halflight/Support/Permissions.swift
      - path: Halflight/Support/PhotoLibrarySaver.swift
      - path: Halflight/Support/StorageMonitor.swift
      - path: Halflight/App/EventLog.swift
    info:
      path: Pawlight/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pawlight
        CFBundleName: Pawlight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSCameraUsageDescription: Pawlight needs the camera to see your pet and take photos.
        NSPhotoLibraryAddUsageDescription: Pawlight saves the photos you choose to your Photos library. It never reads your library.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.halflight.pawlight
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        STRING_CATALOG_GENERATE_SYMBOLS: NO

  PawlightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PawlightTests
    dependencies:
      - target: Pawlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.halflight.pawlight.tests

schemes:
  Halflight:
    build:
      targets:
        Halflight: all
        HalflightTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HalflightTests
    archive:
      config: Release
  Pawlight:
    build:
      targets:
        Pawlight: all
        PawlightTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Pawlight.storekit
    test:
      config: Debug
      targets:
        - PawlightTests
    archive:
      config: Release
