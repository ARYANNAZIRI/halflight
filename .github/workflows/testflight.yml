name: TestFlight

# Manual: Actions → TestFlight → Run workflow, then pick the app. Also runs on tags:
# v0.1.0 uploads Halflight, pawlight-v0.1.0 uploads Pawlight.
# Needs an Xcode with the iOS 27.1 SDK on the runner (the project targets iOS 27.1),
# and these repository secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64  (App Store Connect API key, role App Manager)
#   APPLE_TEAM_ID                                (10-character Team ID)
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to upload
        type: choice
        options: [halflight, pawlight]
        default: halflight
  push:
    tags: ["v*", "pawlight-v*"]

jobs:
  upload:
    name: Archive and upload to TestFlight (${{ inputs.app || (startsWith(github.ref_name, 'pawlight-') && 'pawlight') || 'halflight' }})
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on the runner
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "$(printf '%s\n27.1\n' "$SDK" | sort -V | head -1)" != "27.1" ]; then
            echo "::error::This runner's newest iOS SDK is $SDK; Halflight needs 27.1 for a store build. Archive from a Mac with Xcode 27.1 (fastlane beta) until GitHub runners ship it."
            exit 1
          fi

      - name: Install tools
        run: |
          brew install xcodegen
          sudo gem install fastlane -N

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          APP: ${{ inputs.app || (startsWith(github.ref_name, 'pawlight-') && 'pawlight') || 'halflight' }}
        run: |
          if [ "$APP" = "pawlight" ]; then
            fastlane ios pawlight_beta
          else
            fastlane ios beta
          fi
